name: PR Screenshots

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'FindLocation/**'
  # Lets a maintainer or agent request an on-demand screenshot of the
  # current app (e.g. "show me the main form") without needing a PR.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  screenshots:
    # WinForms only runs on Windows, and GitHub's windows-latest runners
    # provide a real desktop session that can render and be screenshotted.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Only the app source is switched between commits (not the whole tree),
      # so the screenshot script/workflow from the PR head is always the one
      # that runs — including for the PR that first introduces them.
      - name: Screenshot base (before)
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          git checkout ${{ github.event.pull_request.base.sha }} -- FindLocation FindLocation.sln
          git clean -xfd -- FindLocation
          dotnet publish FindLocation/FindLocation.csproj -c Release -o publish-before
          ./.github/scripts/Take-Screenshot.ps1 -ExePath "publish-before/FindLocation.exe" -OutFile "before.png"

      # On a PR this is the head commit; on a manual run it's just
      # whatever ref was dispatched (e.g. main), giving a single current
      # screenshot.
      - name: Screenshot head (after)
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'pull_request') {
            git checkout ${{ github.event.pull_request.head.sha }} -- FindLocation FindLocation.sln
            git clean -xfd -- FindLocation
          }
          dotnet publish FindLocation/FindLocation.csproj -c Release -o publish-after
          ./.github/scripts/Take-Screenshot.ps1 -ExePath "publish-after/FindLocation.exe" -OutFile "after.png"

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: pr-screenshots
          path: |
            before.png
            after.png
          if-no-files-found: ignore

      # Workflow artifacts are hosted on Azure Blob Storage, which is
      # unreachable from some sandboxed agent environments' network
      # policies. Publishing to a plain branch makes the images fetchable
      # through the regular GitHub API/contents endpoint instead.
      - name: Publish screenshots to the screenshots branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan screenshots-publish
          git rm -r -f . *>$null
          New-Item -ItemType Directory -Force -Path latest | Out-Null
          if (Test-Path "before.png") { Copy-Item "before.png" "latest/before.png" }
          if (Test-Path "after.png") { Copy-Item "after.png" "latest/after.png" }
          git add latest
          git commit -m "Screenshots for run ${{ github.run_id }} (${{ github.sha }})"
          git push --force origin HEAD:screenshots
